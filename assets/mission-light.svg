<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-label="Pipeline: foundation model (TerraMind, Prithvi-EO-2.0) to compression (PTQ, QAT, pruning, knowledge distillation) to INT8 model to Vitis AI compile to KP Labs Leopard DPU and ARM">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#eaf2f7"/></linearGradient><clipPath id="frame"><rect width="1200" height="290" rx="18"/></clipPath></defs>
  <g clip-path="url(#frame)"><rect width="1200" height="290" fill="url(#bg)"/>
  <g font-family="'JetBrains Mono','SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace">
    <text x="40" y="50" font-size="19" font-weight="700" fill="#0f172a">From ground-trained foundation model to on-board inference.</text>
    <text x="40" y="76" font-size="13.5" fill="#57606a">Each compression method × model is evaluated on Sen1Floods11 and deployed on the same Leopard unit.</text>
    <g>
      <rect x="40" y="104" width="196" height="132" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.4" stroke-opacity="0.45"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="4.5s" begin="0.0s" repeatCount="indefinite"/></rect>
      <text x="56" y="134" font-size="11.5" fill="#0f766e" letter-spacing="1.5">FOUNDATION MODEL</text>
      <text x="56" y="168" font-size="16" font-weight="700" fill="#0f172a">TerraMind</text>
      <text x="56" y="192" font-size="14" fill="#57606a">Prithvi-EO-2.0</text>
      <text x="56" y="221" font-size="11" fill="#57606a">[FP32]</text>
    </g><line x1="240" y1="170" x2="265" y2="170" stroke="#57606a" stroke-width="1.2" stroke-dasharray="3 4"/><polygon points="265,166 270,170 265,174" fill="#57606a"/><circle r="3.5" fill="#0f766e"><animateMotion path="M 240 170 L 265 170" dur="1.1s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.1s" begin="0.0s" repeatCount="indefinite"/></circle><g>
      <rect x="271" y="104" width="196" height="132" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.4" stroke-opacity="0.45"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="4.5s" begin="0.9s" repeatCount="indefinite"/></rect>
      <text x="287" y="134" font-size="11.5" fill="#0f766e" letter-spacing="1.5">COMPRESSION</text>
      <text x="287" y="168" font-size="16" font-weight="700" fill="#0f172a">PTQ · QAT</text>
      <text x="287" y="192" font-size="14" fill="#57606a">pruning · KD</text>
      <text x="287" y="221" font-size="11" fill="#57606a">[4 methods]</text>
    </g><line x1="471" y1="170" x2="496" y2="170" stroke="#57606a" stroke-width="1.2" stroke-dasharray="3 4"/><polygon points="496,166 501,170 496,174" fill="#57606a"/><circle r="3.5" fill="#0f766e"><animateMotion path="M 471 170 L 496 170" dur="1.1s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.1s" begin="0.9s" repeatCount="indefinite"/></circle><g>
      <rect x="502" y="104" width="196" height="132" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.4" stroke-opacity="0.45"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="4.5s" begin="1.8s" repeatCount="indefinite"/></rect>
      <text x="518" y="134" font-size="11.5" fill="#0f766e" letter-spacing="1.5">COMPRESSED MODEL</text>
      <text x="518" y="168" font-size="16" font-weight="700" fill="#0f172a">INT8 weights</text>
      <text x="518" y="192" font-size="14" fill="#57606a">+ activations</text>
      <text x="518" y="221" font-size="11" fill="#57606a">[INT8]</text>
    </g><line x1="702" y1="170" x2="727" y2="170" stroke="#57606a" stroke-width="1.2" stroke-dasharray="3 4"/><polygon points="727,166 732,170 727,174" fill="#57606a"/><circle r="3.5" fill="#0f766e"><animateMotion path="M 702 170 L 727 170" dur="1.1s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.1s" begin="1.8s" repeatCount="indefinite"/></circle><g>
      <rect x="733" y="104" width="196" height="132" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.4" stroke-opacity="0.45"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="4.5s" begin="2.7s" repeatCount="indefinite"/></rect>
      <text x="749" y="134" font-size="11.5" fill="#0f766e" letter-spacing="1.5">VITIS AI</text>
      <text x="749" y="168" font-size="16" font-weight="700" fill="#0f172a">quantize</text>
      <text x="749" y="192" font-size="14" fill="#57606a">compile → xmodel</text>
      <text x="749" y="221" font-size="11" fill="#57606a">[toolchain]</text>
    </g><line x1="933" y1="170" x2="958" y2="170" stroke="#57606a" stroke-width="1.2" stroke-dasharray="3 4"/><polygon points="958,166 963,170 958,174" fill="#57606a"/><circle r="3.5" fill="#0f766e"><animateMotion path="M 933 170 L 958 170" dur="1.1s" begin="2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.1s" begin="2.7s" repeatCount="indefinite"/></circle><g>
      <rect x="964" y="104" width="196" height="132" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.4" stroke-opacity="0.45"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="4.5s" begin="3.6s" repeatCount="indefinite"/></rect>
      <text x="980" y="134" font-size="11.5" fill="#b45309" letter-spacing="1.5">KP LABS LEOPARD</text>
      <text x="980" y="168" font-size="16" font-weight="700" fill="#0f172a">DPU (FPGA)</text>
      <text x="980" y="192" font-size="14" fill="#57606a">ARM Cortex-A53</text>
      <text x="980" y="221" font-size="11" fill="#57606a">[on-board]</text>
    </g>
    <text x="40" y="268" font-size="12" fill="#57606a">metrics per variant: <tspan fill="#0f766e">water IoU</tspan> · Δ vs FP32 · size · latency · memory · power · DPU vs ARM operator split</text>
  </g></g>
  <rect width="1200" height="290" rx="18" fill="none" stroke="#d0d7de"/>
</svg>